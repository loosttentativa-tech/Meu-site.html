<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#050505;
  --card:#0e0e0e;
  --white:#ffffff;
  --muted:#777;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background: radial-gradient(circle at top,#1a1a1a,#050505);
  color:#fff;
}

/* brilho */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.05),transparent);
  animation:shine 10s linear infinite;
  pointer-events:none;
}
@keyframes shine{
  100%{transform:translateX(50%)}
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.btn{
  background:linear-gradient(135deg,#fff,#bbb);
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
}

/* CARD */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:linear-gradient(145deg,rgba(255,255,255,0.03),rgba(0,0,0,0.7));
  padding:20px;
  border-radius:20px;
  text-align:center;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.05);
  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.card img{
  width:80px;
  height:80px;
  border-radius:50%;
  margin-bottom:10px;
}

/* STATUS */
.status{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.active{background:#00ff88;}
.inactive{background:#ff3b3b;}

.card a{
  display:inline-block;
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-decoration:none;
}

/* FORM */
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #222;
  background:#000;
  color:#fff;
}

/* LOGIN MODAL */
.login-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.login-modal.show{
  opacity:1;
  pointer-events:auto;
}

.login-box{
  background:#111;
  padding:25px;
  border-radius:20px;
  width:260px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>👑 ENGAJA ELITE</h2>
  <div>
    <button id="login" class="btn">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<!-- ADMIN -->
<div id="admin" style="display:none">
  <input id="name" placeholder="Nome">
  <input id="members" placeholder="Membros">
  <input id="img" placeholder="Imagem URL">
  <input id="link" placeholder="Link WhatsApp">
  <select id="status">
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>
  <textarea id="desc" placeholder="Descrição"></textarea>
  <button id="save" class="btn">Salvar</button>
</div>

<!-- LISTA -->
<div id="list" class="grid"></div>

</div>

<!-- LOGIN -->
<div id="loginModal" class="login-modal">
  <div class="login-box">
    <h3>🔐 Acesso</h3>
    <input type="password" id="pass" placeholder="Senha">
    <button id="doLogin" class="btn">Entrar</button>
    <p id="erro" style="display:none;color:red;">Senha incorreta</p>
  </div>
</div>

<script>
const PW="1234";
const KEY="groups_v3";

let groups=JSON.parse(localStorage.getItem(KEY))||[];

const $=e=>document.querySelector(e);

/* LOGIN */
const modal=$("#loginModal");

$("#login").onclick=()=>modal.classList.add("show");

$("#doLogin").onclick=()=>{
  if($("#pass").value===PW){
    modal.classList.remove("show");
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
  }else{
    $("#erro").style.display="block";
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

modal.onclick=(e)=>{
  if(e.target===modal) modal.classList.remove("show");
};

/* RENDER */
function render(){
  $("#list").innerHTML="";
  groups.forEach(g=>{
    const isActive=g.status==="ativo";
    $("#list").innerHTML+=`
    <div class="card">
      <img src="${g.img}">
      <h3>${g.name}</h3>

      <div class="status">
        <div class="dot ${isActive?'active':'inactive'}"></div>
        ${g.members}
      </div>

      <p>${g.desc||""}</p>

      <a href="${g.link}" target="_blank">Entrar</a>
    </div>
    `;
  });
}

/* SALVAR */
$("#save").onclick=()=>{
  let data={
    name:$("#name").value,
    members:$("#members").value,
    img:$("#img").value,
    link:$("#link").value,
    status:$("#status").value,
    desc:$("#desc").value
  };

  groups.unshift(data);
  localStorage.setItem(KEY,JSON.stringify(groups));
  render();
};

render();
</script>

</body>
</html>
