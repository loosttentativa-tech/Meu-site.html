<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupos</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #111 0%, #000 70%);
    color:#fff;
    padding:20px;
}

/* TÍTULO */
h1{
    text-align:center;
    margin-bottom:20px;
}

/* CARD */
.card{
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:15px;
    margin:12px auto;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:15px;
    max-width:600px;
    transition:0.3s;
}

.card:hover{
    transform: translateY(-4px);
}

/* IMAGEM */
img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.2);
}

/* TEXTO */
.info{
    flex:1;
}

.nome{
    font-size:16px;
    font-weight:bold;
}

.desc{
    font-size:12px;
    color:#aaa;
    margin-top:3px;
}

/* STATUS */
.status{
    width:10px;
    height:10px;
    border-radius:50%;
    box-shadow:0 0 10px currentColor;
}

.ativo{
    background:#00ff7f;
    color:#00ff7f;
}

.inativo{
    background:#ff3b3b;
    color:#ff3b3b;
}

/* BOTÃO ENTRAR */
.btn{
    padding:8px 10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    background: linear-gradient(135deg,#00ff88,#00c3ff);
    color:#000;
    transition:0.3s;
}

.btn:hover{
    transform: scale(1.05);
    box-shadow:0 0 12px rgba(0,255,200,0.5);
}
</style>
</head>

<body>

<h1>Grupos</h1>

<div class="card">
    <img src="https://i.pravatar.cc/150?img=1">

    <div class="info">
        <div class="nome">Grupo Elite</div>
        <div class="desc">Comunidade ativa e exclusiva</div>
    </div>

    <div class="status ativo"></div>

    <button class="btn" onclick="entrar('Grupo Elite')">
        Entrar
    </button>
</div>

<div class="card">
    <img src="https://i.pravatar.cc/150?img=2">

    <div class="info">
        <div class="nome">Grupo Vip</div>
        <div class="desc">Acesso restrito para membros selecionados</div>
    </div>

    <div class="status inativo"></div>

    <button class="btn" onclick="entrar('Grupo Vip')">
        Entrar
    </button>
</div>

<script>
function entrar(nome){
    alert("Entrando no " + nome + "...");
}
</script>

</body>
</html>
