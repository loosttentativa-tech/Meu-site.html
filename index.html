<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Grupos</title>

<style>
body{
  background:#000;
  color:#fff;
  font-family:Arial;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin:10px 0;
  display:flex;
  align-items:center;
  gap:15px;
}

.card img{
  width:60px;
  height:60px;
  border-radius:50%;
}

.status{
  width:10px;
  height:10px;
  border-radius:50%;
}

.online{background:lime;}
.offline{background:red;}

button{
  background:#fff;
  color:#000;
  border:none;
  padding:5px 10px;
  cursor:pointer;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha"><br>

<button onclick="login()">Entrar</button>
<button onclick="registrar()">Registrar</button>

<h2>Adicionar Grupo</h2>
<input id="nome" placeholder="Nome">
<input id="foto" placeholder="URL da foto">
<input id="membros" type="number" placeholder="Membros">
<select id="status">
  <option value="online">Online</option>
  <option value="offline">Offline</option>
</select>
<button onclick="addGrupo()">Adicionar</button>

<h2>Grupos</h2>
<div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { 
  getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA18Evh4E-BCu2P7ipJE7wmRWrtcpcuL4c",
  authDomain: "website-e6c83.firebaseapp.com",
  projectId: "website-e6c83",
  storageBucket: "website-e6c83.firebasestorage.app",
  messagingSenderId: "1005197181047",
  appId: "1:1005197181047:web:6e3821ed4658d068524672"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

// 🔁 MANTER LOGIN
onAuthStateChanged(auth, (u) => {
  if(u){
    user = u;
    carregar();
  } else {
    user = null;
    lista.innerHTML = "<p>Faça login para ver os grupos</p>";
  }
});

// 🔐 REGISTRAR
window.registrar = async () => {
  const email = emailInput.value;
  const senha = senhaInput.value;

  try {
    const res = await createUserWithEmailAndPassword(auth, email, senha);
    user = res.user;
    alert("Conta criada!");
  } catch (error) {
    alert(error.code);
    console.log(error);
  }
};

// 🔓 LOGIN
window.login = async () => {
  const email = emailInput.value;
  const senha = senhaInput.value;

  try {
    const res = await signInWithEmailAndPassword(auth, email, senha);
    user = res.user;
    alert("Logado!");
  } catch (error) {
    alert(error.code);
    console.log(error);
  }
};

// ➕ ADD
window.addGrupo = async () => {

  if(!user){
    alert("Faça login primeiro");
    return;
  }

  await addDoc(collection(db, "grupos"), {
    nome: nome.value,
    foto: foto.value,
    membros: Number(membros.value),
    status: status.value,
    owner: user.uid
  });
};

// 📦 LISTAR (TEMPO REAL)
function carregar(){

  onSnapshot(collection(db, "grupos"), (snapshot) => {

    lista.innerHTML = "";

    snapshot.forEach(docu=>{
      const g = docu.data();

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <img src="${g.foto}">
        <div>
          <b>${g.nome}</b><br>
          ${g.membros} membros<br>
          <div class="status ${g.status}"></div>
        </div>
      `;

      if(user && user.uid === g.owner){
        const btn = document.createElement("button");
        btn.innerText = "Remover";
        btn.onclick = async ()=>{
          await deleteDoc(doc(db,"grupos",docu.id));
        };
        div.appendChild(btn);
      }

      lista.appendChild(div);
    });

  });
}

</script>

</body>
</html>
