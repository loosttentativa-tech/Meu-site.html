<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#050505;
  --card:#0f0f0f;
  --gold:#d4af37;
  --gold-soft:#8f6b1a;
  --text:#fff;
  --muted:#888;
}

/* RESET */
*{box-sizing:border-box;margin:0;padding:0}

/* FUNDO PREMIUM */
body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background: radial-gradient(circle at top, #111 0%, #050505 70%);
  color:var(--text);
  overflow-x:hidden;
}

/* BRILHO FUNDO */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:linear-gradient(120deg, transparent, rgba(212,175,55,0.08), transparent);
  animation:shine 8s linear infinite;
}
@keyframes shine{
  0%{transform:translateX(-50%)}
  100%{transform:translateX(50%)}
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.header h2{
  font-size:22px;
  letter-spacing:1px;
}

/* BOTÃO PREMIUM */
.btn{
  background:linear-gradient(135deg,var(--gold),#fff);
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.btn::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);
  transition:.4s;
}

.btn:hover::after{
  left:100%;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* GRID */
.grid-public{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

/* CARD PÚBLICO */
.public-card{
  background:#0c0c0c;
  border-radius:20px;
  padding:18px;
  text-align:center;
  border:1px solid #1a1a1a;
  transition:.3s;
  position:relative;
}

.public-card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 25px rgba(212,175,55,0.2);
}

/* IMAGEM */
.public-card img{
  width:80px;
  height:80px;
  border-radius:50%;
  margin-bottom:10px;
  border:2px solid var(--gold);
  box-shadow:0 0 15px rgba(212,175,55,0.3);
}

/* TITULO */
.public-card h3{
  font-size:16px;
  margin:8px 0;
}

/* STATUS */
.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:13px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.active{
  background:#00ff88;
  animation:pulse 1.5s infinite;
}

.inactive{
  background:#ff3b3b;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(0,255,136,.5)}
  70%{box-shadow:0 0 0 6px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}

/* DESCRIÇÃO */
.public-card p{
  font-size:13px;
  color:var(--muted);
  margin:8px 0;
}

/* BOTÃO ENTRAR */
.public-card a{
  display:inline-block;
  margin-top:10px;
  padding:9px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--gold),#fff);
  color:#000;
  font-weight:700;
  text-decoration:none;
  transition:.2s;
}

.public-card a:hover{
  transform:scale(1.08);
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #222;
  background:#000;
  color:#fff;
  margin-bottom:10px;
}

/* LISTA ADM */
.group-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
}

.group-item:hover{
  background:#141414;
}

.group-item img{
  width:50px;
  height:50px;
  border-radius:50%;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:12px 16px;
  border-radius:10px;
  border:1px solid #222;
  opacity:0;
  transform:translateY(20px);
  transition:.3s;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>👑 Painel ADM</h2>
  <div>
    <button id="login" class="btn">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<!-- ADM -->
<div id="admin" style="display:none">

<div class="card">
  <h3>Grupos</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Novo Grupo</h3>

  <input id="name" placeholder="Nome">
  <input id="members" placeholder="Membros">
  <input id="img" placeholder="Imagem URL">
  <input id="link" placeholder="Link WhatsApp">
  
  <select id="status">
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>

  <textarea id="desc" placeholder="Descrição"></textarea>

  <button id="save" class="btn">Salvar</button>
</div>

</div>

<!-- LISTA -->
<div class="card">
  <div style="font-weight:600;margin-bottom:10px;">Grupos</div>
  <div id="all-groups" class="grid-public"></div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
const PW="1234";
const KEY="groups_v2";

let groups=JSON.parse(localStorage.getItem(KEY))||[];
let edit=null;

const $=e=>document.querySelector(e);

function toast(msg){
  const t=$("#toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

$("#login").onclick=()=>{
  if(prompt("Senha")==PW){
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

function render(){
  $("#list").innerHTML="";
  $("#all-groups").innerHTML="";

  groups.forEach(g=>{

    $("#list").innerHTML+=`
      <div class="group-item">
        <img src="${g.img}">
        <div style="flex:1">
          <b>${g.name}</b><br>
          <small>${g.members} • ${g.status}</small><br>
          <button onclick="editGroup('${g.id}')">Editar</button>
          <button onclick="del('${g.id}')">Remover</button>
        </div>
      </div>
    `;

    const isActive = g.status === "ativo";

    const card=`
      <div class="public-card">
        <img src="${g.img}">
        <h3>${g.name}</h3>

        <div class="status">
          <div class="dot ${isActive ? "active" : "inactive"}"></div>
          ${isActive ? "Ativo" : "Inativo"} • ${g.members}
        </div>

        <p>${g.desc || ""}</p>

        <a href="${g.link}" target="_blank">Entrar</a>
      </div>
    `;

    $("#all-groups").innerHTML+=card;

  });
}

$("#save").onclick=()=>{
  let data={
    id:edit||Date.now(),
    name:$("#name").value,
    members:$("#members").value,
    img:$("#img").value,
    link:$("#link").value,
    status:$("#status").value,
    desc:$("#desc").value
  };

  if(!data.link.includes("chat.whatsapp.com")){
    return alert("Link inválido");
  }

  if(edit){
    groups=groups.map(g=>g.id==edit?data:g);
    edit=null;
  }else{
    groups.unshift(data);
  }

  localStorage.setItem(KEY,JSON.stringify(groups));
  render();
  toast("Salvo com sucesso");
};

function editGroup(id){
  let g=groups.find(x=>x.id==id);
  edit=id;
  $("#name").value=g.name;
  $("#members").value=g.members;
  $("#img").value=g.img;
  $("#link").value=g.link;
  $("#desc").value=g.desc;
}

function del(id){
  if(confirm("Remover grupo?")){
    groups=groups.filter(g=>g.id!=id);
    localStorage.setItem(KEY,JSON.stringify(groups));
    render();
    toast("Removido");
  }
}

render();
</script>

</body>
</html>
