<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Grupos</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
padding:15px;
margin:10px 0;
border-radius:10px;
display:flex;
align-items:center;
gap:15px;
}

img{
width:60px;
height:60px;
border-radius:50%;
}

.status{
width:10px;
height:10px;
border-radius:50%;
}

.online{background:lime;}
.offline{background:red;}

a{
color:white;
text-decoration:none;
padding:10px;
background:#111;
display:inline-block;
margin-bottom:20px;
}
</style>
</head>
<body>

<a href="painel.html">Entrar no Painel</a>

<h1>Todos os Grupos</h1>

<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA18Evh4E-BCu2P7ipJE7wmRWrtcpcuL4c",
  authDomain: "website-e6c83.firebaseapp.com",
  projectId: "website-e6c83",
  storageBucket: "website-e6c83.firebasestorage.app",
  messagingSenderId: "1005197181047",
  appId: "1:1005197181047:web:6e3821ed4658d068524672"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");

onSnapshot(collection(db,"grupos"), snapshot => {
lista.innerHTML = "";

snapshot.forEach(docu=>{
const g = docu.data();

lista.innerHTML += `
<div class="card">
<img src="${g.foto}">
<div>
<b>${g.nome}</b><br>
${g.membros} membros
<div class="status ${g.status}"></div>
</div>
</div>
`;
});
});

</script>
</body>
</html>
