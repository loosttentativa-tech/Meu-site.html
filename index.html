<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#000;
  --card:#111;
  --soft:#1a1a1a;
  --text:#fff;
  --muted:#aaa;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h2{
  margin:0;
  font-weight:600;
}

/* BOTÕES */
.btn{
  background:#fff;
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.btn:hover{
  transform:scale(1.05);
}

/* CARD */
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin-top:20px;
}

/* LISTA ADM */
.group-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
}
.group-item:hover{
  background:var(--soft);
}
.group-item img{
  width:50px;
  height:50px;
  border-radius:50%;
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #222;
  background:#000;
  color:#fff;
  margin-bottom:10px;
}

/* GRID PÚBLICO */
.grid-public{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

/* CARD PÚBLICO */
.public-card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  text-align:center;
  border:1px solid #1f1f1f;
  transition:.25s;
}
.public-card:hover{
  transform:translateY(-6px);
  background:#151515;
}

.public-card img{
  width:70px;
  height:70px;
  border-radius:50%;
  margin-bottom:10px;
}

.public-card h3{
  margin:6px 0;
  font-size:15px;
}

.public-card small{
  color:var(--muted);
}

.public-card p{
  font-size:13px;
  color:var(--muted);
  margin:6px 0;
}

/* BOTÃO ENTRAR */
.public-card a{
  display:inline-block;
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-weight:600;
}

/* TITULOS */
.section-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:10px;
  color:#ddd;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:12px 16px;
  border-radius:10px;
  border:1px solid #222;
  opacity:0;
  transform:translateY(20px);
  transition:.3s;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>Painel ADM</h2>
  <div>
    <button id="login" class="btn">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<!-- ADM -->
<div id="admin" style="display:none">

<div class="card">
  <h3>Grupos</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Novo Grupo</h3>

  <input id="name" placeholder="Nome">
  <input id="members" placeholder="Membros">
  <input id="img" placeholder="Imagem URL">
  <input id="link" placeholder="Link WhatsApp">
  
  <select id="status">
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>

  <textarea id="desc" placeholder="Descrição"></textarea>

  <button id="save" class="btn">Salvar</button>
</div>

</div>

<!-- PREVIEW -->
<div id="preview" class="card"></div>

<!-- PÚBLICO -->
<div class="card">
  <div class="section-title">Grupos ativos</div>
  <div id="ativos" class="grid-public"></div>

  <div class="section-title" style="margin-top:20px">Grupos inativos</div>
  <div id="inativos" class="grid-public"></div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
const PW="1234";
const KEY="groups_v2";

let groups=JSON.parse(localStorage.getItem(KEY))||[];
let edit=null;

const $=e=>document.querySelector(e);

function toast(msg){
  const t=$("#toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

$("#login").onclick=()=>{
  if(prompt("Senha")==PW){
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

function render(){
  $("#list").innerHTML="";
  $("#preview").innerHTML="";
  $("#ativos").innerHTML="";
  $("#inativos").innerHTML="";

  groups.forEach(g=>{

    $("#list").innerHTML+=`
      <div class="group-item">
        <img src="${g.img}">
        <div style="flex:1">
          <b>${g.name}</b><br>
          <small>${g.members} • ${g.status}</small><br>
          <button onclick="editGroup('${g.id}')">Editar</button>
          <button onclick="del('${g.id}')">Remover</button>
        </div>
      </div>
    `;

    const card=`
      <div class="public-card">
        <img src="${g.img}">
        <h3>${g.name}</h3>
        <small>${g.members}</small>
        <p>${g.desc||""}</p>
        <a href="${g.link}" target="_blank">Entrar</a>
      </div>
    `;

    if(g.status==="ativo"){
      $("#ativos").innerHTML+=card;
    }else{
      $("#inativos").innerHTML+=card;
    }

  });
}

$("#save").onclick=()=>{
  let data={
    id:edit||Date.now(),
    name:$("#name").value,
    members:$("#members").value,
    img:$("#img").value,
    link:$("#link").value,
    status:$("#status").value,
    desc:$("#desc").value
  };

  if(!data.link.includes("chat.whatsapp.com")){
    return alert("Link inválido");
  }

  if(edit){
    groups=groups.map(g=>g.id==edit?data:g);
    edit=null;
  }else{
    groups.unshift(data);
  }

  localStorage.setItem(KEY,JSON.stringify(groups));
  render();
  toast("Salvo com sucesso");
};

function editGroup(id){
  let g=groups.find(x=>x.id==id);
  edit=id;
  $("#name").value=g.name;
  $("#members").value=g.members;
  $("#img").value=g.img;
  $("#link").value=g.link;
  $("#desc").value=g.desc;
}

function del(id){
  if(confirm("Remover grupo?")){
    groups=groups.filter(g=>g.id!=id);
    localStorage.setItem(KEY,JSON.stringify(groups));
    render();
    toast("Removido");
  }
}

render();
</script>

</body>
</html>
