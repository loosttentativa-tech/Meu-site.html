<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário, Maria!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.8rem;
      color: #ff3b6b;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: #ff3b6b;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 59, 107, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    .btn:hover {
      background-color: #e02d5a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🎉🎂🎈</div>
    <h1>FELIZ ANIVERSÁRIO, MARIA!</h1>
    <p>Desejo-te um dia cheio de alegria, paz e muitos momentos felizes! Que todos os teus sonhos se realizem.</p>
    <button class="btn" onclick="alert('🥳 Parabéns e muitas felicidades!')">Clique aqui!</button>
  </div>

</body>
</html>
