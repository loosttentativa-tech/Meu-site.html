<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#050505;
  --card:#0e0e0e;
  --white:#ffffff;
  --soft:#bfbfbf;
  --muted:#777;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background: radial-gradient(circle at top, #1a1a1a 0%, #050505 70%);
  color:var(--white);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
  animation:shine 10s linear infinite;
}

@keyframes shine{
  0%{transform:translateX(-50%)}
  100%{transform:translateX(50%)}
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h2{
  font-size:22px;
  letter-spacing:1px;
  background:linear-gradient(90deg,#fff,#888,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.btn{
  background:linear-gradient(135deg,#fff,#bfbfbf);
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,255,255,0.2);
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(255,255,255,0.4);
}

.card{
  background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.7));
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.06);
}

.grid-public{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.public-card{
  background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.7));
  border-radius:20px;
  padding:18px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.06);
  position:relative;
  backdrop-filter: blur(10px);
}

.public-card img{
  width:80px;
  height:80px;
  border-radius:50%;
  margin-bottom:10px;
  border:2px solid #fff;
}

.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:13px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.active{ background:#00ff88; }
.inactive{ background:#ff3b3b; }

.public-card a{
  display:inline-block;
  margin-top:10px;
  padding:9px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff,#ccc);
  color:#000;
  font-weight:700;
  text-decoration:none;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #222;
  background:#000;
  color:#fff;
  margin-bottom:10px;
}

.group-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
}

.group-item img{
  width:50px;
  height:50px;
  border-radius:50%;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:12px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
}
.toast.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>👑 Painel ADM</h2>
  <div>
    <button id="login" class="btn">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<div id="admin" style="display:none">

<div class="card">
  <h3>Grupos</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Novo Grupo</h3>

  <input id="name" placeholder="Nome">
  <input id="members" placeholder="Membros">
  <input id="img" placeholder="Imagem URL">
  <input id="link" placeholder="Link WhatsApp">
  
  <select id="status">
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>

  <textarea id="desc" placeholder="Descrição"></textarea>

  <button id="save" class="btn">Salvar</button>
</div>

</div>

<div class="card">
  <div>Grupos</div>
  <div id="all-groups" class="grid-public"></div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const PW="1234";
const KEY="groups_v2";

let groups=JSON.parse(localStorage.getItem(KEY))||[];
let edit=null;

const $=e=>document.querySelector(e);

function toast(msg){
  const t=$("#toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

$("#login").onclick=()=>{
  if(prompt("Senha")==PW){
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

function render(){
  $("#list").innerHTML="";
  $("#all-groups").innerHTML="";

  let html="";

  groups.forEach(g=>{

    $("#list").innerHTML+=`
      <div class="group-item">
        <img src="${g.img || 'https://via.placeholder.com/80'}">
        <div>
          <b>${g.name}</b><br>
          <button onclick="editGroup('${g.id}')">Editar</button>
          <button onclick="del('${g.id}')">Remover</button>
        </div>
      </div>
    `;

    const isActive = g.status === "ativo";

    html += `
      <div class="public-card">
        <img src="${g.img || 'https://via.placeholder.com/80'}">
        <h3>${g.name}</h3>

        <div class="status">
          <div class="dot ${isActive ? "active" : "inactive"}"></div>
          ${g.members}
        </div>

        <p>${g.desc || ""}</p>

        <a href="${g.link}" target="_blank" rel="noopener noreferrer">Entrar</a>
      </div>
    `;
  });

  $("#all-groups").innerHTML = html;
}

$("#save").onclick=()=>{
  let data={
    id:edit||Date.now(),
    name:$("#name").value,
    members:$("#members").value,
    img:$("#img").value,
    link:$("#link").value,
    status:$("#status").value,
    desc:$("#desc").value
  };

  if(!data.link.includes("chat.whatsapp.com")){
    return alert("Link inválido");
  }

  if(edit){
    groups=groups.map(g=>g.id==edit?data:g);
    edit=null;
  }else{
    groups.unshift(data);
  }

  localStorage.setItem(KEY,JSON.stringify(groups));
  render();

  $("#name").value="";
  $("#members").value="";
  $("#img").value="";
  $("#link").value="";
  $("#desc").value="";
  $("#status").value="ativo";

  toast("Salvo");
};

window.editGroup = function(id){
  let g=groups.find(x=>x.id==id);
  edit=id;
  $("#name").value=g.name;
  $("#members").value=g.members;
  $("#img").value=g.img;
  $("#link").value=g.link;
  $("#desc").value=g.desc;
  $("#status").value=g.status;
};

window.del = function(id){
  if(confirm("Remover grupo?")){
    groups=groups.filter(g=>g.id!=id);
    localStorage.setItem(KEY,JSON.stringify(groups));
    render();
  }
};

render();

});
</script>

</body>
</html>
