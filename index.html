<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#050505;
  --card:#0e0e0e;
  --white:#ffffff;
  --soft:#bfbfbf;
  --muted:#777;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background: radial-gradient(circle at top, #1a1a1a 0%, #050505 70%);
  color:var(--white);
  overflow-x:hidden;
}

/* brilho */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
  animation:shine 10s linear infinite;
  pointer-events:none;
}

@keyframes shine{
  0%{transform:translateX(-50%)}
  100%{transform:translateX(50%)}
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h2{
  font-size:22px;
  letter-spacing:1px;
  background:linear-gradient(90deg,#fff,#888,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.btn{
  background:linear-gradient(135deg,#fff,#bfbfbf);
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

/* cards */
.card{
  background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.7));
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  backdrop-filter: blur(10px);
}

.grid-public{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.public-card{
  background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.7));
  border-radius:20px;
  padding:18px;
  text-align:center;
}

.public-card img{
  width:80px;
  height:80px;
  border-radius:50%;
}

.status{
  font-size:13px;
  color:#888;
}

.public-card a{
  display:inline-block;
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-decoration:none;
}

/* LOGIN MODAL */
.login-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:999;
}

.login-modal.show{
  opacity:1;
  pointer-events:auto;
}

.login-box{
  background:#111;
  padding:30px;
  border-radius:20px;
  width:280px;
  text-align:center;
}

.login-box input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:10px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1;}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>👑 Painel ADM</h2>
  <div>
    <button id="login" class="btn">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<div id="admin" style="display:none">
<div class="card">
  <h3>Novo Grupo</h3>
  <input id="name" placeholder="Nome">
  <input id="link" placeholder="Link WhatsApp">
  <button id="save" class="btn">Salvar</button>
</div>
</div>

<div class="card">
  <div id="all-groups" class="grid-public"></div>
</div>

</div>

<!-- LOGIN -->
<div id="loginModal" class="login-modal">
  <div class="login-box">
    <h2>🔐 Acesso</h2>
    <input type="password" id="loginPass" placeholder="Senha">
    <button id="loginBtn" class="btn">Entrar</button>
    <p id="loginError" style="display:none;color:red;">Senha incorreta</p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const PW="1234";
let groups=[];

const $=e=>document.querySelector(e);

const modal=$("#loginModal");
const input=$("#loginPass");
const error=$("#loginError");

$("#login").onclick=()=>{
  modal.classList.add("show");
};

$("#loginBtn").onclick=()=>{
  if(input.value===PW){
    modal.classList.remove("show");
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
    input.value="";
    error.style.display="none";
  }else{
    error.style.display="block";
  }
};

input.addEventListener("keypress",(e)=>{
  if(e.key==="Enter") $("#loginBtn").click();
});

modal.onclick=(e)=>{
  if(e.target===modal){
    modal.classList.remove("show");
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

function render(){
  let html="";
  groups.forEach(g=>{
    html+=`
    <div class="public-card">
      <h3>${g.name}</h3>
      <a href="${g.link}" target="_blank">Entrar</a>
    </div>`;
  });
  $("#all-groups").innerHTML=html;
}

$("#save").onclick=()=>{
  groups.push({
    name:$("#name").value,
    link:$("#link").value
  });
  render();
};

render();

});
</script>

</body>
</html>
