<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGAJA ELITE</title>

<link rel="icon" href="https://storageblack.cloud/midia/1773117490092.jpg">

<style>
:root{
  --bg:#050505;
  --gold:#FFD700;
  --card:#111;
  --glow:0 0 12px rgba(255,215,0,0.4);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background: radial-gradient(circle at top,#111,#050505);
  color:#fff;
}

/* LOADER */
.loader{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:9999;
  animation:fadeOut 1s ease 2s forwards;
}
.loader h1{
  color:var(--gold);
  letter-spacing:3px;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{opacity:0.4}
  50%{opacity:1}
  100%{opacity:0.4}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* BOTÕES */
.btn{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#111;
  color:#fff;
  transition:.3s;
}
.btn.primary{
  background:linear-gradient(45deg,var(--gold),#aaa);
  color:#000;
  box-shadow:var(--glow);
}
.btn:hover{
  transform:scale(1.05);
  box-shadow:var(--glow);
}

/* GRID ADM */
.grid{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:20px;
  margin-top:20px;
}

.card{
  background:rgba(255,255,255,0.03);
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,215,0,0.15);
  backdrop-filter:blur(6px);
}

/* LISTA ADM */
.group-item{
  display:flex;
  gap:10px;
  padding:10px;
  border-radius:10px;
  transition:.3s;
}
.group-item:hover{
  background:rgba(255,255,255,0.05);
  transform:scale(1.02);
}
.group-item img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
  margin-bottom:8px;
}

/* PUBLIC GRID */
.grid-public{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
  margin-top:10px;
}

.public-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,215,0,0.2);
  border-radius:12px;
  padding:12px;
  text-align:center;
  transition:.3s;
}
.public-card:hover{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 0 15px rgba(255,215,0,0.3);
}
.public-card img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
}
.public-card a{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  background:linear-gradient(45deg,#FFD700,#aaa);
  color:#000;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:12px 16px;
  border-radius:8px;
  box-shadow:var(--glow);
  opacity:0;
  transform:translateY(20px);
  transition:.3s;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="loader">
  <h1>ENGAJA ELITE</h1>
</div>

<div class="container">

<div class="header">
  <h2>Painel ADM</h2>
  <div>
    <button id="login" class="btn primary">Entrar</button>
    <button id="logout" class="btn" style="display:none">Sair</button>
  </div>
</div>

<!-- ADM -->
<div id="admin" style="display:none">

<div class="grid">

<div class="card">
  <h3>Grupos</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Novo Grupo</h3>

  <input id="name" placeholder="Nome">
  <input id="members" placeholder="Membros">
  <input id="img" placeholder="Imagem URL">
  <input id="link" placeholder="Link WhatsApp">
  
  <select id="status">
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>

  <textarea id="desc" placeholder="Descrição"></textarea>

  <button id="save" class="btn primary">Salvar</button>
</div>

</div>

</div>

<!-- PREVIEW -->
<div id="preview" class="card" style="margin-top:20px"></div>

<!-- ÁREA PÚBLICA -->
<div class="card" style="margin-top:20px">
  <h2>🔥 Grupos Ativos</h2>
  <div id="ativos" class="grid-public"></div>

  <h2 style="margin-top:20px">🚫 Grupos Inativos</h2>
  <div id="inativos" class="grid-public"></div>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
const PW="1234";
const KEY="groups_v2";

let groups=JSON.parse(localStorage.getItem(KEY))||[];
let edit=null;

const $=e=>document.querySelector(e);

function toast(msg){
  const t=$("#toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

$("#login").onclick=()=>{
  if(prompt("Senha")==PW){
    $("#admin").style.display="block";
    $("#login").style.display="none";
    $("#logout").style.display="inline-block";
  }
};

$("#logout").onclick=()=>{
  $("#admin").style.display="none";
  $("#login").style.display="inline-block";
  $("#logout").style.display="none";
};

function render(){
  $("#list").innerHTML="";
  $("#preview").innerHTML="";
  $("#ativos").innerHTML="";
  $("#inativos").innerHTML="";

  groups.forEach(g=>{

    // ADM
    $("#list").innerHTML+=`
      <div class="group-item">
        <img src="${g.img}">
        <div style="flex:1">
          <b>${g.name}</b><br>
          <small>${g.members} • ${g.status}</small><br>
          <button onclick="editGroup('${g.id}')">Editar</button>
          <button onclick="del('${g.id}')">Remover</button>
        </div>
      </div>
    `;

    // PREVIEW
    $("#preview").innerHTML+=`
      <div class="group-item">
        <img src="${g.img}">
        <div>
          <b>${g.name}</b><br>
          <a href="${g.link}" target="_blank">Entrar</a>
        </div>
      </div>
    `;

    // PÚBLICO
    const card=`
      <div class="public-card">
        <img src="${g.img}">
        <h3>${g.name}</h3>
        <small>${g.members}</small>
        <p>${g.desc||""}</p>
        <a href="${g.link}" target="_blank">Entrar</a>
      </div>
    `;

    if(g.status==="ativo"){
      $("#ativos").innerHTML+=card;
    }else{
      $("#inativos").innerHTML+=card;
    }

  });
}

$("#save").onclick=()=>{
  let data={
    id:edit||Date.now(),
    name:$("#name").value,
    members:$("#members").value,
    img:$("#img").value,
    link:$("#link").value,
    status:$("#status").value,
    desc:$("#desc").value
  };

  if(!data.link.includes("chat.whatsapp.com")){
    return alert("Link inválido");
  }

  if(edit){
    groups=groups.map(g=>g.id==edit?data:g);
    edit=null;
  }else{
    groups.unshift(data);
  }

  localStorage.setItem(KEY,JSON.stringify(groups));
  render();
  toast("Salvo com sucesso 💎");
};

function editGroup(id){
  let g=groups.find(x=>x.id==id);
  edit=id;
  $("#name").value=g.name;
  $("#members").value=g.members;
  $("#img").value=g.img;
  $("#link").value=g.link;
  $("#desc").value=g.desc;
}

function del(id){
  if(confirm("Remover?")){
    groups=groups.filter(g=>g.id!=id);
    localStorage.setItem(KEY,JSON.stringify(groups));
    render();
    toast("Removido 🚫");
  }
}

render();
</script>

</body>
</html>
