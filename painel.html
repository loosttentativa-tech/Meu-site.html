
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #111 0%, #000 70%);
    color:#fff;
    padding:20px;
}

/* TITULO */
h1,h3{
    text-align:center;
}

/* INPUTS */
input,select{
    padding:10px;
    margin:6px 0;
    width:100%;
    max-width:320px;
    border-radius:8px;
    border:none;
    outline:none;
    background:#111;
    color:#fff;
}

/* BOTÕES GERAIS */
button{
    padding:10px 12px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#00ff88,#00c3ff);
    color:#000;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 12px rgba(0,255,200,0.5);
}

/* CARD */
.card{
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:15px;
    margin:10px auto;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:15px;
    max-width:600px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
}

/* IMG */
img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.2);
}

/* INFO */
.card b{
    font-size:16px;
}

.card small{
    color:#aaa;
}

/* STATUS */
.status{
    width:10px;
    height:10px;
    border-radius:50%;
    margin-left:5px;
    box-shadow:0 0 10px currentColor;
}

.online{
    background:#00ff7f;
    color:#00ff7f;
}

.offline{
    background:#ff3b3b;
    color:#ff3b3b;
}

/* BOTÃO ENTRAR */
.enter{
    margin-left:auto;
    padding:8px 10px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffcc00,#ff8800);
    color:#000;
    font-weight:bold;
    text-decoration:none;
    transition:0.3s;
    display:inline-block;
}

.enter:hover{
    transform:scale(1.05);
    box-shadow:0 0 12px rgba(255,200,0,0.6);
}

/* AUTH BOX */
#authDiv{
    text-align:center;
    margin-bottom:20px;
}

/* PAINEL */
#painelDiv{
    text-align:center;
}
</style>
</head>

<body>

<h1>Painel</h1>

<div id="authDiv">
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <br>
  <button onclick="login()">Entrar</button>
  <button onclick="registrar()">Registrar</button>
</div>

<div id="painelDiv" style="display:none;">

  <p id="userInfo"></p>
  <button onclick="logout()">Sair</button>

  <hr>

  <h3>Adicionar Grupo</h3>

  <input id="nome" placeholder="Nome">
  <input id="foto" placeholder="URL da foto">
  <input id="membros" type="number" placeholder="Membros">
  <input id="link" placeholder="Link do grupo WhatsApp">

  <select id="status">
    <option value="online">Online</option>
    <option value="offline">Offline</option>
  </select>

  <button onclick="addGrupo()">Adicionar</button>

  <h3>Seus Grupos</h3>
  <div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
updateDoc,
doc,
query,
where,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA18Evh4E-BCu2P7ipJE7wmRWrtcpcuL4c",
authDomain: "website-e6c83.firebaseapp.com",
projectId: "website-e6c83",
storageBucket: "website-e6c83.firebasestorage.app",
messagingSenderId: "1005197181047",
appId: "1:1005197181047:web:6e3821ed4658d068524672"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

function linkValido(url){
  return url.startsWith("https://chat.whatsapp.com/") && url.length > 30;
}

window.registrar = async()=>{
  const emailVal = document.getElementById("email").value;
  const senhaVal = document.getElementById("senha").value;
  try {
    await createUserWithEmailAndPassword(auth, emailVal, senhaVal);
    alert("Conta criada com sucesso!");
  } catch (e) {
    alert("Erro ao registrar: " + e.message);
  }
};

window.login = async()=>{
  const emailVal = document.getElementById("email").value;
  const senhaVal = document.getElementById("senha").value;
  try {
    await signInWithEmailAndPassword(auth, emailVal, senhaVal);
  } catch (e) {
    alert("Erro ao entrar: " + e.message);
  }
};

window.logout = () => signOut(auth);

window.addGrupo = async()=>{
  if(!user) return;

  const nome = document.getElementById("nome").value;
  const foto = document.getElementById("foto").value;
  const membros = document.getElementById("membros").value;
  const status = document.getElementById("status").value;
  const link = document.getElementById("link").value;

  if(!linkValido(link)) return alert("Link inválido");

  try {
    await addDoc(collection(db,"grupos"),{
      nome, foto,
      membros:Number(membros),
      status, link,
      owner:user.uid
    });
    alert("Grupo adicionado!");
  } catch (e) {
    alert("Erro ao salvar: " + e.message);
  }
};

onAuthStateChanged(auth, u=>{
  const authDiv = document.getElementById("authDiv");
  const painelDiv = document.getElementById("painelDiv");
  const userInfo = document.getElementById("userInfo");

  if(u){
    user = u;
    authDiv.style.display = "none";
    painelDiv.style.display = "block";
    userInfo.innerText = "Logado: " + u.email;
    carregar();
  } else {
    user = null;
    authDiv.style.display = "block";
    painelDiv.style.display = "none";
  }
});

function carregar(){
  const lista = document.getElementById("lista");
  const q = query(collection(db,"grupos"), where("owner", "==", user.uid));

  onSnapshot(q, snap => {
    lista.innerHTML = "";
    snap.forEach(d => {
      const g = d.data();
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <img src="${g.foto}">
        <div style="flex:1; text-align:left;">
          <b>${g.nome}</b>
          <span class="status ${g.status}"></span><br>
          <small>${g.membros} membros</small>
        </div>
        <a class="enter" href="${g.link}" target="_blank">Entrar</a>
        <button onclick="editar('${d.id}')">Editar</button>
        <button onclick="remover('${d.id}')">Excluir</button>
      `;
      lista.appendChild(div);
    });
  });
}

window.remover = async(id) => {
  if(confirm("Deseja excluir este grupo?")) {
    await deleteDoc(doc(db, "grupos", id));
  }
};

window.editar = async(id) => {
  const novoNome = prompt("Novo nome:");
  const novoLink = prompt("Novo link:");

  if(novoLink && !linkValido(novoLink)){
    alert("Link inválido");
    return;
  }

  const updates = {};
  if(novoNome) updates.nome = novoNome;
  if(novoLink) updates.link = novoLink;

  if(Object.keys(updates).length > 0) {
    await updateDoc(doc(db, "grupos", id), updates);
  }
};

</script>

</body>
</html>

```
