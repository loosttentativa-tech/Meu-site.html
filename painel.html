<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
padding:15px;
margin:10px 0;
border-radius:10px;
display:flex;
align-items:center;
gap:15px;
}

img{
width:60px;
height:60px;
border-radius:50%;
}

button{
padding:8px;
margin:5px;
cursor:pointer;
}

input,select{
padding:8px;
margin:5px;
width:200px;
}

a{
color:lightblue;
}
</style>
</head>
<body>

<h1>Painel</h1>

<!-- LOGIN -->
<div id="auth">
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <button onclick="registrar()">Registrar</button>
</div>

<!-- PAINEL -->
<div id="painel" style="display:none;">

  <p id="userInfo"></p>
  <button onclick="logout()">Sair</button>

  <hr>

  <h3>Adicionar Grupo</h3>

  <input id="nome" placeholder="Nome">
  <input id="foto" placeholder="URL da foto">
  <input id="membros" type="number" placeholder="Membros">
  <input id="link" placeholder="Link do grupo WhatsApp">

  <select id="status">
    <option value="online">Online</option>
    <option value="offline">Offline</option>
  </select>

  <button onclick="addGrupo()">Adicionar</button>

  <h3>Seus Grupos</h3>
  <div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
updateDoc,
doc,
query,
where,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA18Evh4E-BCu2P7ipJE7wmRWrtcpcuL4c",
authDomain: "website-e6c83.firebaseapp.com",
projectId: "website-e6c83",
storageBucket: "website-e6c83.firebasestorage.app",
messagingSenderId: "1005197181047",
appId: "1:1005197181047:web:6e3821ed4658d068524672"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

// 🔗 VALIDAR LINK WHATSAPP
function linkValido(url){
  const regex = /^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9]+$/;
  return regex.test(url.trim());
}

// 🔐 REGISTRAR
window.registrar = async()=>{
  try{
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    await createUserWithEmailAndPassword(auth,email,senha);
    alert("Conta criada!");
  }catch(e){
    alert(e.code);
  }
};

// 🔓 LOGIN
window.login = async()=>{
  try{
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    await signInWithEmailAndPassword(auth,email,senha);
    alert("Logado!");
  }catch(e){
    alert(e.code);
  }
};

// 🚪 LOGOUT
window.logout = async()=>{
  await signOut(auth);
};

// ➕ ADD GRUPO
window.addGrupo = async()=>{

  if(!user){
    alert("Faça login primeiro");
    return;
  }

  const nome = document.getElementById("nome").value;
  const foto = document.getElementById("foto").value;
  const membros = document.getElementById("membros").value;
  const status = document.getElementById("status").value;
  const link = document.getElementById("link").value;

  if(!linkValido(link)){
    alert("Link do WhatsApp inválido");
    return;
  }

  await addDoc(collection(db,"grupos"),{
    nome,
    foto,
    membros:Number(membros),
    status,
    link,
    owner:user.uid
  });
};

// 🔁 CONTROLE DE LOGIN
onAuthStateChanged(auth,u=>{
  const authDiv = document.getElementById("auth");
  const painel = document.getElementById("painel");
  const userInfo = document.getElementById("userInfo");

  if(u){
    user = u;

    authDiv.style.display = "none";
    painel.style.display = "block";

    userInfo.innerText = "Logado como: " + u.email;

    carregar();
  } else {
    user = null;

    authDiv.style.display = "block";
    painel.style.display = "none";
  }
});

// 📦 LISTAR GRUPOS DO USUÁRIO
function carregar(){

  const lista = document.getElementById("lista");

  const q = query(
    collection(db,"grupos"),
    where("owner","==",user.uid)
  );

  onSnapshot(q,snapshot=>{
    lista.innerHTML="";

    snapshot.forEach(docu=>{
      const g = docu.data();

      const div=document.createElement("div");
      div.className="card";

      div.innerHTML=`
        <img src="${g.foto}">
        <div>
          <b>${g.nome}</b><br>
          ${g.membros} membros<br>
          <a href="${g.link}" target="_blank">Entrar no grupo</a>
        </div>
        <button onclick="editar('${docu.id}')">Editar</button>
        <button onclick="remover('${docu.id}')">Remover</button>
      `;

      lista.appendChild(div);
    });
  });
}

// ❌ REMOVER
window.remover = async(id)=>{
  await deleteDoc(doc(db,"grupos",id));
};

// ✏️ EDITAR
window.editar = async(id)=>{

  const novoNome = prompt("Novo nome:");
  const novoLink = prompt("Novo link WhatsApp:");

  if(novoLink && !linkValido(novoLink)){
    alert("Link inválido!");
    return;
  }

  await updateDoc(doc(db,"grupos",id),{
    nome: novoNome,
    link: novoLink
  });
};

</script>

</body>
</html>
