<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
padding:15px;
margin:10px 0;
border-radius:10px;
display:flex;
align-items:center;
gap:15px;
}

img{
width:60px;
height:60px;
border-radius:50%;
}

button{
padding:8px;
margin:5px;
}

input,select{
padding:8px;
margin:5px;
}
</style>
</head>
<body>

<h1>Painel</h1>

<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
<button onclick="registrar()">Registrar</button>

<hr>

<input id="nome" placeholder="Nome">
<input id="foto" placeholder="URL da foto">
<input id="membros" type="number" placeholder="Membros">

<select id="status">
<option value="online">Online</option>
<option value="offline">Offline</option>
</select>

<button onclick="addGrupo()">Adicionar</button>

<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
updateDoc,
doc,
query,
where,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyA18Evh4E-BCu2P7ipJE7wmRWrtcpcuL4c",
  authDomain: "website-e6c83.firebaseapp.com",
  projectId: "website-e6c83",
  storageBucket: "website-e6c83.firebasestorage.app",
  messagingSenderId: "1005197181047",
  appId: "1:1005197181047:web:6e3821ed4658d068524672"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user = null;

window.registrar = async()=>{
await createUserWithEmailAndPassword(auth,email.value,senha.value);
};

window.login = async()=>{
await signInWithEmailAndPassword(auth,email.value,senha.value);
};

window.addGrupo = async()=>{
await addDoc(collection(db,"grupos"),{
nome:nome.value,
foto:foto.value,
membros:Number(membros.value),
status:status.value,
owner:user.uid
});
};

onAuthStateChanged(auth,u=>{
if(u){
user=u;
carregar();
}
});

function carregar(){

const q = query(
collection(db,"grupos"),
where("owner","==",user.uid)
);

onSnapshot(q,snapshot=>{
lista.innerHTML="";

snapshot.forEach(docu=>{
const g = docu.data();

const div=document.createElement("div");

div.className="card";

div.innerHTML=`
<img src="${g.foto}">
<div>
<b>${g.nome}</b><br>
${g.membros}
</div>
<button onclick="editar('${docu.id}')">Editar</button>
<button onclick="remover('${docu.id}')">Remover</button>
`;

lista.appendChild(div);
});
});
}

window.remover = async(id)=>{
await deleteDoc(doc(db,"grupos",id));
};

window.editar = async(id)=>{
const novoNome = prompt("Novo nome:");
if(novoNome){
await updateDoc(doc(db,"grupos",id),{
nome:novoNome
});
}
};

</script>

</body>
</html>
